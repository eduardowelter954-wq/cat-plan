<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat-Plan - Finanças</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div class="dashboard-container" style="max-width: 1400px;">
        
        <!-- COLUNA 1: Menu Lateral -->
        <nav class="sidebar">
            <button class="menu-btn tarefas" onclick="window.location.href='dashboard.html'">Tarefas</button>
            <button class="menu-btn estudos" onclick="window.location.href='estudos.html'">Estudos</button>
            <button class="menu-btn active financas" onclick="window.location.href='financas.html'">Finanças</button>
            <button class="menu-btn organizacao">Organização</button>
            <button class="menu-btn hobby">Hobby</button>
        </nav>

        <!-- COLUNA 2 E 3: Área Central (Meses e Legenda) -->
        <section class="financas-centro">
            
            <!-- Coluna dos Meses (O JS vai preencher isso sozinho agora!) -->
            <div class="coluna-meses" id="listaMesesFinancas">
                <!-- Os meses vão aparecer aqui -->
            </div>

            <!-- Coluna da Legenda e Edição de Porcentagens -->
            <div class="coluna-legenda">
                <h4 style="font-size: 16px; margin-bottom: 5px;">Quantidade de gastos no mês:</h4>
                
                <div class="legenda-item">
                    <div class="bubble-card bubble-vermelho" style="flex-grow: 1;" id="legendaVermelha">Acima de 80%</div>
                    <img src="icone-editar.png" alt="Editar" class="icon-edit" id="btnEditVermelho" style="position: relative; width: 20px; cursor: pointer;" title="Editar limite vermelho">
                </div>
                
                <div class="legenda-item">
                    <div class="bubble-card bubble-laranja" style="flex-grow: 1;" id="legendaLaranja">de 61% a 79%</div>
                    <!-- Espaçador invisível do mesmo tamanho do ícone para manter o alinhamento perfeito -->
                    <div style="width: 20px;"></div>
                </div>
                
                <div class="legenda-item">
                    <div class="bubble-card bubble-verde" style="flex-grow: 1;" id="legendaVerde">de 0% a 60%</div>
                    <img src="icone-editar.png" alt="Editar" class="icon-edit" id="btnEditVerde" style="position: relative; width: 20px; cursor: pointer;" title="Editar limite verde">
                </div>
            </div>
            
        </section>

        <!-- COLUNA 4: Painel Direito (Subguias de Finanças) -->
        <aside class="right-panel" style="width: 280px;">
            <div class="top-buttons">
                <button class="action-btn action-btn-verde active-page">Registro</button>
                <button class="action-btn action-btn-verde" onclick="window.location.href='metas-dinheiro.html'">Metas de dinheiro</button>
                <button class="action-btn action-btn-verde" onclick="window.location.href='gastos.html'">Gastos</button>
                <button class="action-btn action-btn-verde" onclick="window.location.href='contas-fixas.html'">Contas fixas</button>
                <button class="action-btn action-btn-verde">Cadastro de conta no banco e forma de pagamento</button>
                <button class="action-btn action-btn-verde">Entrada e transferência de dinheiro</button>
                <button class="action-btn action-btn-verde">Extrato bancário</button>
            </div>
        </aside>

    </div>

    <!-- Puxando o nosso novo arquivo JavaScript -->
    <script src="financas.js"></script>
</body>
</html>
