<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat-Plan - Compromissos</title>
    <link rel="stylesheet" href="dashboard.css?v=2">
</head>
<body>
    <div class="dashboard-container">
        
        <!-- Menu Lateral -->
        <nav class="sidebar">
            <button class="menu-btn tarefas" onclick="window.location.href='dashboard.html'">Agenda</button>
            <button class="menu-btn active estudos" onclick="window.location.href='estudos.html'">Tarefas</button>
            <button class="menu-btn financas" onclick="window.location.href='financas.html'">Financeiro</button> 
            <button class="menu-btn organizacao" onclick="window.location.href='organizacao.html'">Anotações</button>
            <button class="menu-btn hobby">Hobby</button>
        </nav>

        <!-- NOVO MIOLO: Layout de Compromissos -->
        <section class="compromissos-layout">
            
            <!-- Coluna Esquerda: Cadastro -->
            <div class="card form-compromisso">
                <div class="card-header">
                    <h3>COMPROMISSO</h3>
                </div>
                <div class="input-area">
                    <textarea id="descCompromisso" placeholder="Descrever."></textarea>
                </div>
                <!-- Campo de data sutil para alimentar a lógica -->
                <div class="date-picker-area">
                    <input type="date" id="dataCompromisso">
                </div>
                <div class="card-footer">
                    <img src="icone-adicionar.png" alt="Adicionar" class="icon-add" id="btnSalvarCompromisso">
                </div>
            </div>

            <!-- Coluna Direita: Lista dinâmica -->
            <div class="lista-compromissos" id="containerCompromissos">
                <!-- Os cartões vão aparecer aqui automaticamente -->
            </div>

        </section>

        <!-- Botões Superiores Direitos e Mascote -->
        <aside class="right-panel">
            <div class="top-buttons">
                <!-- Links para navegar entre as páginas -->
                <button class="action-btn" onclick="window.location.href='dashboard.html'">Organização</button>
                <button class="action-btn active-page">Cadastros dos Compromissos</button>
            </div>
            
            <!-- Mascote cortado pela metade -->
            <img src="gato-escondido.png" alt="Gato escondido" class="mascot-peeking">
        </aside>

    </div>
    
    <script src="compromissos.js"></script>
</body>
</html>
