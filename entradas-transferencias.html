<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat-Plan - Entrada e Transferência</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div class="dashboard-container" style="max-width: 1400px;">
        
        <!-- Menu Lateral -->
        <nav class="sidebar">
            <button class="menu-btn tarefas" onclick="window.location.href='dashboard.html'">Agenda</button>
            <button class="menu-btn active estudos" onclick="window.location.href='estudos.html'">Tarefas</button>
            <button class="menu-btn financas" onclick="window.location.href='financas.html'">Financeiro</button> 
            <button class="menu-btn organizacao">Anotações</button>
            <button class="menu-btn hobby">Hobby</button>
        </nav>

        <!-- Área Central -->
        <section style="flex-grow: 1; padding: 20px; display: flex; flex-direction: column; gap: 30px; align-items: flex-start;">
            
            <!-- Botão de Adicionar (Abre o cartão de cadastro) -->
            <div>
                <img src="icone-adicionar.png" alt="Nova Movimentação" id="btnNovaMovimentacao" style="width: 28px; cursor: pointer; margin-left: 10px;" title="Registrar entrada ou transferência">
            </div>

            <!-- Container onde os cartões salvos vão aparecer -->
            <div id="containerMovimentacoes" style="display: flex; flex-direction: column; gap: 20px; width: 100%;">
                <!-- O JavaScript injeta os cartões aqui -->
            </div>

        </section>

        <!-- Painel Direito (Subguias) -->
        <aside class="right-panel" style="width: 280px;">
            <div class="top-buttons">
                <button class="action-btn action-btn-verde" onclick="window.location.href='financas.html'">Controle de Gasto</button>
                <button class="action-btn action-btn-verde" onclick="window.location.href='metas-dinheiro.html'">Poupança e Metas</button>
                <button class="action-btn action-btn-verde" onclick="window.location.href='gastos.html'">Gastos</button>
                <button class="action-btn action-btn-verde" onclick="window.location.href='contas-fixas.html'">Contas Mensais</button>
                <button class="action-btn action-btn-verde active-page" onclick="window.location.href='contas-banco.html'">Saldo</button>
                <button class="action-btn action-btn-verde" onclick="window.location.href='entradas-transferencias.html'">Ganho / Movimentação de Dinheiro</button>
                <button class="action-btn action-btn-verde" onclick="window.location.href='extrato.html'">Extrato Financeiro</button>
            </div>
        </aside>

    </div>

    <script src="entradas-transferencias.js"></script>
</body>
</html>
