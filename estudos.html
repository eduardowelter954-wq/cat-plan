<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat-Plan - Estudos</title>
    <link rel="stylesheet" href="dashboard.css?v=2">
</head>
<body>
    <div class="dashboard-container" style="max-width: 1400px;">
        
        <!-- Menu Lateral -->
        <nav class="sidebar">
            <button class="menu-btn tarefas" onclick="window.location.href='dashboard.html'">Tarefas</button>
            <button class="menu-btn active estudos" onclick="window.location.href='estudos.html'">Estudos</button>
            <button class="menu-btn financas" onclick="window.location.href='financas.html'">Finanças</button>
            <button class="menu-btn organizacao">Organização</button>
            <button class="menu-btn hobby">Hobby</button>
        </nav>

        <!-- NOVO LAYOUT: Calendário na Esquerda e Tarefas na Direita -->
        <div style="display: flex; gap: 20px; flex-grow: 1; padding: 20px;">
            
            <!-- Calendário de Estudos (Esquerda) -->
            <section class="calendario-estudos" style="flex-grow: 1;">
                
                <div class="date-navigation" style="display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 15px;">
                    <!-- Linha 1: Setas e Data (Mês/Ano) -->
                    <div style="display: flex; justify-content: center; align-items: center; gap: 20px;">
                        <button class="arrow-btn" id="btnSemanaAnterior"><img src="seta-esquerda-azul.png" alt="Anterior"></button>
                        <span id="mesAnoDisplay" style="font-weight: bold; font-size: 16px; text-transform: uppercase;">MÊS ANO</span>
                        <button class="arrow-btn" id="btnSemanaProxima"><img src="seta-direita-azul.png" alt="Próximo"></button>
                    </div>
                    
                    <!-- Linha 2: Ícone do Calendário Centralizado Embaixo -->
                    <div style="position: relative; width: 35px; height: 35px;">
                        <img src="icone-calendario.png" alt="Calendário" class="calendar-icon" style="width: 100%; height: 100%; object-fit: contain;">
                        <input type="date" id="calendarioPicker" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;">
                    </div>
                </div>

                <!-- Grade dos dias da semana (Sexta, Sábado e Domingo mais compridos) -->
                <div class="week-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="day-card" id="dia-Segunda" data-diadasemana="Segunda">
                        <h4 id="head-Segunda">Segunda<br><span></span></h4>
                        <div class="tasks-container"></div>
                    </div>
                    <div class="day-card" id="dia-Terça" data-diadasemana="Terça">
                        <h4 id="head-Terça">Terça<br><span></span></h4>
                        <div class="tasks-container"></div>
                    </div>
                    <div class="day-card" id="dia-Quarta" data-diadasemana="Quarta">
                        <h4 id="head-Quarta">Quarta<br><span></span></h4>
                        <div class="tasks-container"></div>
                    </div>
                    <div class="day-card" id="dia-Quinta" data-diadasemana="Quinta">
                        <h4 id="head-Quinta">Quinta<br><span></span></h4>
                        <div class="tasks-container"></div>
                    </div>
                    
                    <!-- SEXTA, SÁBADO E DOMINGO OCUPANDO A LINHA INTEIRA -->
                    <div class="day-card" id="dia-Sexta" data-diadasemana="Sexta" style="grid-column: 1 / span 2;">
                        <h4 id="head-Sexta">Sexta<br><span></span></h4>
                        <div class="tasks-container" style="display: flex; gap: 10px; flex-wrap: wrap;"></div>
                    </div>
                    <div class="day-card" id="dia-Sábado" data-diadasemana="Sábado" style="grid-column: 1 / span 2;">
                        <h4 id="head-Sábado">Sábado<br><span></span></h4>
                        <div class="tasks-container" style="display: flex; gap: 10px; flex-wrap: wrap;"></div>
                    </div>
                    <div class="day-card" id="dia-Domingo" data-diadasemana="Domingo" style="grid-column: 1 / span 2;">
                        <h4 id="head-Domingo">Domingo<br><span></span></h4>
                        <div class="tasks-container" style="display: flex; gap: 10px; flex-wrap: wrap;"></div>
                    </div>
                </div>
            </section>

            <!-- Painel de Tarefas Sem Data (Direita do Calendário) -->
            <section class="tarefas-sem-data" style="width: 350px; display: flex; flex-direction: column; gap: 10px;">
                
                <!-- Barra de Pesquisa -->
                <div style="display: flex; width: 100%; border: 2px solid #4a90e2; border-radius: 8px; overflow: hidden; background: #fff;">
                    <input type="text" id="inputPesquisaTarefas" placeholder="Pesquisar descrição..." style="flex-grow: 1; padding: 10px; border: none; outline: none; font-size: 15px;">
                    <button style="background-color: #4a90e2; border: none; padding: 10px 15px; cursor: default;">
                        <span style="color: white; font-weight: bold; font-size: 16px;">🔍</span>
                    </button>
                </div>

                <!-- Fundo Azul para Soltar e Guardar Tarefas -->
                <div class="dropzone-azul" id="areaEspera" style="flex-grow: 1; background-color: #a3c4f3; border-radius: 10px; padding: 15px; display: flex; flex-direction: column; gap: 10px; min-height: 500px; overflow-y: auto;">
                    <p style="color: #333; font-weight: bold; text-align: center; margin-bottom: 10px; width: 100%;">Tarefas Sem Data</p>
                    <!-- As tarefas entram aqui -->
                </div>
            </section>
        </div>

        <!-- Painel Direito e Lixeira -->
        <aside class="right-panel">
            <div class="top-buttons">
                <button class="action-btn action-btn-azul active-page">Calendário de tarefas</button>
                <button class="action-btn action-btn-azul" onclick="window.location.href='cadastro-tarefas.html'">Cadastro de tarefas e checklist de etapas</button>
                <button class="action-btn action-btn-azul" onclick="window.location.href='avaliacoes.html'">Avaliações</button>
            </div>
            
            <div class="delete-zone" style="margin-top: 40px; text-align: center;">
                <img src="icone-lixeira.png" alt="Lixeira" id="btnLixeira" style="width: 50px; cursor: pointer; margin-bottom: 20px; transition: transform 0.2s;">
                <div class="confirm-box" style="border: 2px solid #000; padding: 5px; width: 100%; height: 40px; display: flex; align-items: center; justify-content: center;">
                    <img src="icone-check.png" id="btnConfirmarExclusao" style="width: 25px; cursor: pointer;">
                </div>
            </div>
            
            <img src="gato-preto.png" alt="Mascote Gato Preto" style="width: 120px; align-self: flex-end; margin-top: auto;">
        </aside>

    </div>

    <script src="estudos.js"></script>
</body>
</html>
