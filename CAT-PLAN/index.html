<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat-Plan Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- O Fundo Rosa Vintage -->
    <div class="victorian-frame">
        
        <!-- O Gatinho no canto esquerdo -->
        <img src="gato.png" alt="Mascote Gato" class="mascot-cat">
        
        <!-- A Caixa de Conteúdo -->
        <div class="content-box">
            
            <!-- Logo no topo da caixa -->
            <div class="logo-banner">CAT-PLAN</div>
            
            <!-- Título com sublinhados -->
            <div class="title-area">
                <span class="title-text">Cadastre ou entre</span>
                <span class="title-text">na sua conta:</span>
            </div>

            <!-- Formulário -->
            <form id="loginForm">
                
                <!-- Campo Usuário -->
                <div class="input-group">
                    <input type="text" id="username" required>
                    <div class="pink-line-dashed"></div>
                </div>
                
                <!-- Campo Senha -->
                <div class="password-group">
                    <label for="password">Senha:</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="password" required>
                        <div class="pink-line-solid"></div>
                    </div>
                </div>

                <!-- Botão invisível para permitir envio com a tecla Enter -->
                <button type="submit" class="hidden-btn">Entrar</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
